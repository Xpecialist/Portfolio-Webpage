  <rect x="135" y="110" width="530" height="300" rx="20" fill="#06223a" stroke="#f5b82e" stroke-width="4"/>
  <g stroke="#0b3a5e" stroke-width="2">
    <path d="M241 120V400M347 120V400M453 120V400M559 120V400"/>
  </g>
  <!-- symbols: 5 x 3 grid of simple shapes -->
  <g font-family="Segoe UI Emoji, Apple Color Emoji, sans-serif" font-size="54" text-anchor="middle">
