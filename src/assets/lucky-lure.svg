  </defs>
  <rect width="800" height="500" fill="url(#sea)"/>
  <g fill="#7dd3fc" opacity="0.25">
    <circle cx="90" cy="420" r="6"/><circle cx="110" cy="380" r="4"/><circle cx="700" cy="440" r="7"/><circle cx="725" cy="395" r="4"/><circle cx="660" cy="80" r="5"/>
  </g>
  <text x="400" y="78" text-anchor="middle" font-family="Georgia, serif" font-size="46" font-weight="700" fill="url(#gold)">Lucky Lure</text>
