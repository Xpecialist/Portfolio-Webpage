    <text x="188" y="280">🐠</text><text x="294" y="280">🎣</text><text x="400" y="280">🐟</text><text x="506" y="280">🎣</text><text x="612" y="280">🐟</text>
    <text x="188" y="375">⚓</text><text x="294" y="375">🐟</text><text x="400" y="375">⭐</text><text x="506" y="375">⚓</text><text x="612" y="375">🐠</text>
  </g>
  <path d="M160 262 L640 262" stroke="#fde68a" stroke-width="4" stroke-dasharray="10 8" opacity="0.7"/>
