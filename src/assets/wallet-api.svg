<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#134e4a"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#0d9488"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <g opacity="0.08" stroke="#5eead4">
    <path d="M0 100H800M0 200H800M0 300H800M0 400H800M100 0V500M200 0V500M300 0V500M400 0V500M500 0V500M600 0V500M700 0V500"/>
  </g>
  <!-- wallet card -->
  <rect x="120" y="120" width="330" height="200" rx="22" fill="url(#card)"/>
  <rect x="150" y="160" width="54" height="40" rx="7" fill="#fde68a" opacity="0.9"/>
  <text x="150" y="258" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" fill="#042f2e">$ 1,250.00</text>
  <text x="150" y="292" font-family="Consolas, monospace" font-size="16" fill="#042f2e" opacity="0.75">WALLET · USD</text>
  <!-- transactions panel -->
  <rect x="400" y="190" width="290" height="210" rx="18" fill="#1e293b" stroke="#334155"/>
  <text x="425" y="225" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#cbd5e1">Transactions</text>
  <g font-family="Consolas, monospace" font-size="14">
    <circle cx="433" cy="258" r="8" fill="#2dd4bf"/><text x="452" y="263" fill="#94a3b8">DEPOSIT</text><text x="665" y="263" fill="#5eead4" text-anchor="end">+200.00</text>
    <circle cx="433" cy="298" r="8" fill="#f87171"/><text x="452" y="303" fill="#94a3b8">TRANSFER</text><text x="665" y="303" fill="#fca5a5" text-anchor="end">-45.50</text>
    <circle cx="433" cy="338" r="8" fill="#f87171"/><text x="452" y="343" fill="#94a3b8">WITHDRAW</text><text x="665" y="343" fill="#fca5a5" text-anchor="end">-20.00</text>
    <circle cx="433" cy="378" r="8" fill="#2dd4bf"/><text x="452" y="383" fill="#94a3b8">TRANSFER</text><text x="665" y="383" fill="#5eead4" text-anchor="end">+12.00</text>
  </g>
  <!-- lock badge -->
  <circle cx="660" cy="120" r="44" fill="#0f172a" stroke="#2dd4bf" stroke-width="3"/>
  <rect x="642" y="118" width="36" height="28" rx="5" fill="#2dd4bf"/>
  <path d="M648 118v-10a12 12 0 0 1 24 0v10" fill="none" stroke="#2dd4bf" stroke-width="5"/>
  <text x="120" y="440" font-family="Consolas, monospace" font-size="16" fill="#5eead4" opacity="0.8">POST /api/wallets/transfer · JWT</text>
